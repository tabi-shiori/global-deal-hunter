name: GLOBAL DEAL HUNTER - 2h Automated Intelligence Cron

on:
  schedule:
    # Runs automatically every 2 hours, 24/7 on GitHub Cloud
    - cron: '0 */2 * * *'
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "gdh-cron-and-pages"
  cancel-in-progress: false

jobs:
  hunt-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Space Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run 2-Hour Deal Discovery, Deduplication & URL Verification
        if: github.event_name != 'push'
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          python3 scripts/collector.py --mode github_actions_2h_cron

      - name: Commit Updated Intelligence Snapshot & Database
        if: github.event_name != 'push'
        run: |
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git config user.name "Global Deal Hunter Bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/deals.db data/dashboard_snapshot.json
            git commit -m "chore(intel): 2h automated deal verification & snapshot update [skip ci]"
            git push
          fi

      - name: Assemble Static Cloud Dashboard Bundle
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp -r web/* _site/
          cp data/dashboard_snapshot.json _site/data/dashboard_snapshot.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: hunt-and-verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Cloud Dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
